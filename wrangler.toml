name = "edgeever"
main = ".wrangler/edgeever-worker/index.js"
compatibility_date = "2026-08-18"
workers_dev = true
no_bundle = true
find_additional_modules = true
base_dir = ".wrangler/edgeever-worker"

[[rules]]
type = "ESModule"
globs = ["modules/*.js"]
fallthrough = true

[build]
command = "bun scripts/build-cloudflare-worker.mjs"
watch_dir = ["apps/api/src", "packages/shared/src"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "edgeever"
database_id = "43c3160a-b2fe-4fe1-b89f-506d2c6b044e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RESOURCES"
bucket_name = "edgeever-resources"
preview_bucket_name = "edgeever-resources-preview"

[observability]
enabled = true
